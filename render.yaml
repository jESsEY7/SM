services:
  - type: web
    name: sylvia-api
    runtime: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn lumen.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,sylviamuchiraesthetics.beauty,www.sylviamuchiraesthetics.beauty,api.sylviamuchiraesthetics.beauty,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sylviamuchiraesthetics.beauty,https://www.sylviamuchiraesthetics.beauty,https://sylviamuchiri.netlify.app"
      - key: DATABASE_URL
        fromDatabase:
          name: sylvia-db
          property: connectionString

databases:
  - name: sylvia-db
    databaseName: sylvia_aesthetics
    user: sylvia_user
    plan: free
